[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-warrior"
version = "0.1.0"
description = "A motorcycle racing reinforcement learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame==2.6.1", "gymnasium>=1.2,<2", "numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["rogue_warrior*"]
